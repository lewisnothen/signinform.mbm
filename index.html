<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        body {
            background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;

        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            height: 1000px;
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 15px rgba(0, 0, 0, 0.3);
            margin-left: 35%;
            margin-top: 15%;
            margin-bottom: 15%;
        }

        .form-control:focus {
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.4);
            border-color: #0d6efd;
        }

        .btn-primary {
            padding: 0.6rem;
            font-weight: 600;
            border-radius: 8px;
        }

        .form-check-label,
        .forgot-link {
            font-size: 0.9rem;
        }

        .social-icons {
            text-align: center;
            margin-top: 20px;
        }

        .social-icons a {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            margin: 5px;

            border: 1px solid #aaa;
            border-radius: 50%;
            color: #555;
            text-align: center;
        }

        .social-icons a:hover {
            color: white;
            background: wheat;
            border-color: ivory;
        }

        /* Start of Nav  */

        #Logo {
            height: 8%;
            width: 10%;
        }

        #intro {
            margin-top: 200px;
           
        }

        #bgcolor {
            background: rgba(255, 255, 255, 0.9);
            border: solid 1px;
            border-color: ivory;
            box-shadow: 3px slategray;
        }


        .title-size {
            font-size: x-large;
            text-decoration: underline rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .small-text {
            text-decoration: underline rgba(255, 255, 255, 0.9);
        }

        .nav-item:hover {
            text-decoration-line: underline;
        }


        /* Start of Footer */
        .footer {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-top: 1px solid #ddd;

        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .footer h4 {
            margin-bottom: 10px;
        }

        .footer a {
            display: block;
            text-decoration: none;
            color: rgba(0, 0, 0, 0.685);
            margin-bottom: 5px;
        }

        .bottom-bar {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .footer a:hover {
            color: green;
            text-transform: uppercase;
            /* change to any color you want */
        }

        * {
            box-sizing: border-box;
        }

        .social-icons {
            text-align: center;
            margin-top: 20px;
        }

        .social-icons a {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            margin: 5px;

            border: 1px solid #aaa;
            border-radius: 50%;
            color: #555;
            text-align: center;
        }

        .social-icons a:hover {
            color: white;
            background: green;
            border-color: green;
        }

        .animation :hover {
            color: rgb(3, 98, 3)
        }

        .contact{
            margin-left: 100px;
        }

        /*End of FOOTER */
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="bgcolor">
        <div class="container-fluid">

            <a href="#" class="nav-brand d-flex align-items-center">
                <img src="Sign in logo.png" alt="Logo" id="Logo" class="d-inline-block align-text-top me-2">
                <div class="d-flex flex-column lh-1">
                    <span class="fw-bold pb-2 fs-6 text-dark title-size">Log in</span>
                    <small class="text-muted small-text" style="font-size: 0.7rem;">
                        Log in • Sign in • Register
                    </small>
                </div>
            </a>


            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav gap-lg-3 fw-medium">
                    <li class="nav-item">
                        <a class="nav-link active custom-active-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link me-5" href="#" id="nav-text">Sign in</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="login-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted">Please sign in to your account</p>
            </div>

            <!-- Sign In Form -->
            <form action="#" method="POST">
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary ">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" placeholder="email" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary ">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••"
                            required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-secondary" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="text-decoration-none forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>

                <div class="text-center">
                    <small class="text-muted">Don't have an account? <a href="#"
                            class="text-decoration-none fw-semibold">Sign Up</a></small>
                </div>

                <div class="social-icons">
                    <a href="https://www.facebook.com/"><i class="fab fa-facebook"></i></a>
                    <a href="https://www.snapchat.com/"><i class="fab fa-snapchat"></i></a>
                    <a href="https://web.telegram.org/a/"><i class="fab fa-telegram"></i></a>
                    <a href="https://www.tiktok.com/en/"><i class="fab fa-tiktok"></i></a>
                </div>
            </form>
        </div>
    </div>

    <br>

    <!-- FOOTER -->
    <!-- Footer -->
    <div class="footer">
        <div class="footer-grid">
            <div>
                <a href="#"><img src="Sign in logo.png" alt="" class="col-sm-5 w-100"></a>

            </div>

            <div>
                <h4 class="fw-bold text-dark">Sign In</h4>
            </div>


            <div>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary ">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" id="email" placeholder="email" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary ">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••"
                            required>
                    </div>
                </div>
            </div>

            <div class="contact">
                <h4>Contact Us</h4>
                <a href="#" class="animation">+95 9123456789</a>
                <a href="#" class="animation">signup@gmail.com</a>
            </div>

        </div>

        <div class="social-icons">
            <a href="https://www.facebook.com/"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.snapchat.com/"><i class="fab fa-snapchat-ghost"></i></a>
            <a href="https://web.telegram.org/a/"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://www.tiktok.com/en/"><i class="fab fa-tiktok"></i></a>
        </div>

        <div class="bottom-bar">
            © copyright Sign in. All rights reserved.
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
